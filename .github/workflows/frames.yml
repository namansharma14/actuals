name: frames
# The vision's frame set, captured on the runner and uploaded as an artifact. Called by ci.yml
# on pushes that touch the site, and by nightly.yml on main every night with a longer retention.
on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14
      artifact-name:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frames:
    name: frames (the vision's frame set, contact sheets, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: { node-version: 20, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - name: Root dependencies (the site compiles ../src, which resolves zod from here)
        run: npm ci
      - run: npm ci
        working-directory: site
      - name: Playwright and axe (not saved to the lockfile)
        run: npm i --no-save @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        working-directory: site
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: Start the site
        shell: bash
        run: |
          (cd site && npx next start -p 3000 > ../next-start.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3000/ || { cat next-start.log; exit 1; }
      - name: Capture frames, sheets and axe
        run: node scripts/frames.mjs
        env: { FRAMES_BASE: "http://127.0.0.1:3000", FRAMES_OUT: frames }
      - name: Upload frames and contact sheets
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('frames-{0}', github.sha) }}
          path: |
            frames/
            next-start.log
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn
