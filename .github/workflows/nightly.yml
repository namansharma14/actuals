name: nightly
# Every night on main: the frame set again, kept 30 days, so a fresh contact sheet is always
# there to read even when nothing was pushed. 15:17 UTC is 01:17 in Brisbane.
on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frames:
    uses: ./.github/workflows/frames.yml
    with:
      retention-days: 30
      artifact-name: frames-nightly-${{ github.run_id }}
